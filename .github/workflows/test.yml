name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag devpulse-api:test .
      - name: Start API container
        run: docker run --detach --name devpulse-api --publish 8000:8000 devpulse-api:test
      - name: Verify container health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"healthy"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs devpulse-api
          exit 1

